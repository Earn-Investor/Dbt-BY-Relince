<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Portal | Login & Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');

        /* Pure page par fade-in animation */
        @keyframes pageFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            background: url('loginbg.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            animation: pageFade 1.2s ease-out;
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            width: 90%;
            max-width: 450px;
            overflow: hidden; /* Header image corners round karne ke liye */
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            position: relative;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Reliance Header Image Styling */
        .header-banner {
            background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRRVPxc5Mm3haZOQwmUgW2B1UUBbpDsd1kyWA&s') no-repeat center;
            background-size: cover;
            padding: 30px 10px;
            text-align: center;
            border-bottom: 3px solid #1e40af;
            position: relative;
        }

        /* Overlay to make text readable if needed */
        .header-banner::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.2); /* Image opacity control */
            z-index: 1;
        }

        .logo-box { position: relative; z-index: 10; margin-bottom: 5px; }

        .form-content { padding: 25px 35px 35px 35px; }

        .form-input {
            width: 100%;
            background: #f3f4f6;
            border-radius: 50px;
            padding: 14px 22px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            outline: none;
            transition: 0.3s;
        }

        .form-input:focus { border-color: #1e40af; box-shadow: 0 0 8px rgba(30,64,175,0.2); }

        .tab-btn { font-weight: 800; cursor: pointer; padding-bottom: 5px; transition: 0.3s; }
        .active-tab { color: #1e40af; border-bottom: 3px solid #1e40af; }
        
        .send-btn { color: #1e40af; font-weight: bold; cursor: pointer; }
        #translate-btn { position: absolute; top: 15px; right: 15px; font-size: 12px; cursor: pointer; background: #fff; border: 1px solid #ddd; padding: 5px 12px; border-radius: 20px; z-index: 50; }
        
        .forgot-pass { display: block; text-align: right; font-size: 13px; color: #ef4444; font-weight: 600; margin-top: -10px; margin-bottom: 20px; cursor: pointer; }

        @keyframes customBounce {
            0%, 100% { transform: translateY(0); opacity: 1; }
            50% { transform: translateY(-5px); opacity: 0.8; }
        }
        .animated-text { animation: customBounce 2s infinite ease-in-out; position: relative; z-index: 10; }
    </style>
</head>
<body>

<div class="glass-container">
    <div id="translate-btn" onclick="toggleLanguage()"><i class="fas fa-language"></i> EN/HI</div>
    
    <!-- Header with Reliance Image -->
    <div class="header-banner">
        <div class="logo-box">
            <img src="logo.png" alt="Logo" class="mx-auto" style="width: 110px;">
        </div>
        <p class="animated-text text-green-900 font-extrabold tracking-tighter text-sm uppercase">
            Welcome To Official Investment Hub
        </p>
    </div>

    <div class="form-content">
        <div class="flex justify-around mb-6">
            <span id="signup-tab" class="tab-btn active-tab" onclick="switchTab('signup')">Sign Up</span>
            <span id="signin-tab" class="tab-btn text-gray-400" onclick="switchTab('signin')">Sign In</span>
        </div>

        <!-- Sign Up Form -->
        <div id="signup-form">
            <label class="text-xs font-bold text-gray-500 ml-4">Phone Number</label>
            <div class="flex gap-2">
                <select class="form-input w-24"><option>+91</option></select>
                <input type="number" id="phone" placeholder="Phone Number" class="form-input">
            </div>

            <label class="text-xs font-bold text-gray-500 ml-4">Nickname (Min 5 letters)</label>
            <input type="text" id="nickname" placeholder="Nickname" class="form-input">

            <label class="text-xs font-bold text-gray-500 ml-4">Login Password (Min 6 chars)</label>
            <input type="password" id="pass" placeholder="Password" class="form-input">

            <label class="text-xs font-bold text-gray-500 ml-4">Invitation Code (Optional)</label>
            <input type="text" id="invite" placeholder="Invitation Code" class="form-input">

            <label class="text-xs font-bold text-gray-500 ml-4">Verification Code (OTP)</label>
            <div class="relative">
                <input type="text" id="otp-input" placeholder="Verification Code" class="form-input">
                <span class="absolute right-5 top-3 send-btn" onclick="sendOTP()" id="send-btn">Send</span>
            </div>

            <button onclick="handleAuth('signup')" class="w-full bg-red-600 text-white font-bold py-4 rounded-full mt-2 shadow-lg hover:bg-red-700 transition">Sign Up Now</button>
        </div>

        <!-- Sign In Form -->
        <div id="signin-form" class="hidden">
            <label class="text-xs font-bold text-gray-500 ml-4">Phone Number</label>
            <input type="number" id="login-phone" placeholder="Phone Number" class="form-input">
            
            <label class="text-xs font-bold text-gray-500 ml-4">Password</label>
            <input type="password" id="login-pass" placeholder="Password" class="form-input">

            <span class="forgot-pass" onclick="alert('Contact Admin for password reset.')">Forgot Password?</span>

            <button onclick="handleAuth('signin')" class="w-full bg-blue-800 text-white font-bold py-4 rounded-full shadow-lg hover:bg-blue-900 transition">Sign In Now</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC7apT-d-R9bpcb4LcpFk4P0cpw9sKxi-0",
        authDomain: "dbt-online-earning.firebaseapp.com",
        databaseURL: "https://dbt-online-earning-default-rtdb.firebaseio.com",
        projectId: "dbt-online-earning",
        storageBucket: "dbt-online-earning.firebasestorage.app",
        messagingSenderId: "319083357519",
        appId: "1:319083357519:web:62ccf6d8ce0dca3152513a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let generatedOTP = null;
    let currentLang = 'EN';

    window.sendOTP = function() {
        const phone = document.getElementById('phone').value;
        if(phone.length < 10) return alert("Enter valid phone number!");
        generatedOTP = Math.floor(100000 + Math.random() * 900000);
        document.getElementById('send-btn').innerText = "Wait...";
        setTimeout(() => {
            alert("Verification Code: " + generatedOTP);
            document.getElementById('send-btn').innerText = "Resend";
        }, 1500);
    }

    window.switchTab = function(tab) {
        if(tab === 'signup') {
            document.getElementById('signup-form').classList.remove('hidden');
            document.getElementById('signin-form').classList.add('hidden');
            document.getElementById('signup-tab').classList.add('active-tab');
            document.getElementById('signin-tab').classList.remove('active-tab');
        } else {
            document.getElementById('signup-form').classList.add('hidden');
            document.getElementById('signin-form').classList.remove('hidden');
            document.getElementById('signin-tab').classList.add('active-tab');
            document.getElementById('signup-tab').classList.remove('active-tab');
        }
    }

    window.toggleLanguage = function() {
        const labels = document.querySelectorAll('label');
        const forgotBtn = document.querySelector('.forgot-pass');
        if(currentLang === 'EN') {
            labels[0].innerText = "फोन नंबर";
            labels[1].innerText = "निकनेम (कम से कम 5 अक्षर)";
            labels[2].innerText = "पासवर्ड (कम से कम 6 अक्षर)";
            labels[5].innerText = "फोन नंबर";
            labels[6].innerText = "पासवर्ड";
            forgotBtn.innerText = "पासवर्ड भूल गए?";
            currentLang = 'HI';
        } else {
            labels[0].innerText = "Phone Number";
            labels[1].innerText = "Nickname (Min 5 letters)";
            labels[2].innerText = "Login Password (Min 6 chars)";
            labels[5].innerText = "Phone Number";
            labels[6].innerText = "Password";
            forgotBtn.innerText = "Forgot Password?";
            currentLang = 'EN';
        }
    }

    window.handleAuth = async function(type) {
        if(type === 'signup') {
            const phone = document.getElementById('phone').value;
            const nick = document.getElementById('nickname').value;
            const pswd = document.getElementById('pass').value;
            const otp = document.getElementById('otp-input').value;

            if(!phone || !nick || !pswd) return alert("Fill all details!");
            if(nick.length < 5) return alert("Nickname: Min 5 letters!");
            if(pswd.length < 6) return alert("Password: Min 6 chars!");
            if(otp != generatedOTP) return alert("Wrong OTP!");

            set(ref(db, 'users/' + phone), { phone, nickname: nick, password: pswd, balance: 0 })
            .then(() => { alert("Created! Please Sign In."); switchTab('signin'); });
        } else {
            const lPhone = document.getElementById('login-phone').value;
            const lPass = document.getElementById('login-pass').value;
            if(!lPhone || !lPass) return alert("Enter login details!");
            const dbRef = ref(getDatabase());
            get(child(dbRef, `users/${lPhone}`)).then((snap) => {
                if (snap.exists() && snap.val().password === lPass) {
                    alert("Welcome " + snap.val().nickname);
                    window.location.href = "dashboard.html";
                } else { alert("Invalid Credentials!"); }
            });
        }
    }
</script>

</body>
</html>
